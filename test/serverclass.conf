restartSplunkd = 1
stateOnClient = enabled

[serverClass:entSearchHeads:app:ci5_cluster_search_base]

[serverClass:entIntermediaryFwdrs]
whitelist.0 = ci5-persn000000000900329-hf1
restartSplunkWeb = 0
restartSplunkd = 1
stateOnClient = enabled

[serverClass:entIntermediaryFwdrs:app:org_intermediate_forwarder_inputs]
[serverClass:entIntermediaryFwdrs:app:org_intermediate_forwarder_pipelines]

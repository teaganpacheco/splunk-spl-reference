[global]
crossServerChecksum = true

[serverClass:enterpriseDefaults]
whitelist.0 = *
blacklist.0 = 
restartSplunkWeb = 0
restartSplunkd = 1
stateOnClient = enabled

## [serverClass:enterpriseDefaults:app:org_all_deploymentclient]
[serverClass:enterpriseDefaults:app:org_all_forwarder_outputs]
[serverClass:enterpriseDefaults:app:ci5_all_indexes]
[serverClass:enterpriseDefaults:app:oci5_indexer_volume_indexes]

[serverClass:entClusterManager]
targetRepositoryLocation = /opt/splunk/etc/apps
whitelist.0 = ci5-persn000000000900329-cm1
restartSplunkWeb = 0
restartSplunkd = 1
stateOnClient = enabled

[serverClass:entClusterManager:app:org_cluster_manager_base]

[serverClass:entClusterMembers]
targetRepositoryLocation = /opt/splunk/etc/manager-apps
whitelist.0 = ci5-persn000000000900329-cm1
restartSplunkWeb = 0
restartSplunkd = 0
stateOnClient = noop

[serverClass:entClusterMembers:app:ci5_all_indexer_base]
[serverClass:entClusterMembers:app:ci5_all_indexes]
[serverClass:entClusterMembers:app:oci5_indexer_volume_indexes]
[serverClass:entClusterMembers:app:scc2_datagen_indexes]
[serverClass:entClusterMembers:app:scc2_indexer_orig_fwd_props]

[serverClass:entDeploymentServer]
targetRepositoryLocation = /opt/splunk/etc/deployment-apps
whitelist.0 = ci5-persn000000000900329-ds2
restartSplunkWeb = 0
restartSplunkd = 0
stateOnClient = noop

[serverClass:entDeploymentServer:app:*]

[serverClass:entSearchHeads]
whitelist.0 = ci5-persn000000000900329-sh1
whitelist.1 = ci5-persn000000000900329-mc1
